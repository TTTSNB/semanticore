name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every third-party action is pinned to a full commit SHA; the trailing
# comment records the tag it resolved from. To bump one, resolve the new tag
# with `git ls-remote --tags https://github.com/<owner>/<repo>` (use the
# `^{}` line for annotated tags) and update both the SHA and the comment.
#
# The job names `lint` and `test` are required status checks under branch
# protection. Do not rename them.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test
        run: cargo test --all --all-features

  # Build and test on exactly the `rust-version` declared in Cargo.toml.
  # Keep the toolchain below in sync with `workspace.package.rust-version`.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      # No lockfile is committed, so ask the resolver to prefer dependency
      # versions whose own rust-version is <= 1.88 (what downstream users on
      # the MSRV get with Cargo's MSRV-aware resolver).
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - name: Confirm toolchain
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.'
      - name: cargo build
        run: cargo build --workspace --all-targets --all-features
      - name: cargo test
        run: cargo test --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
      - name: cargo test --doc
        run: cargo test --workspace --doc --all-features

  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo publish --dry-run
        run: cargo publish --dry-run -p semanticore-core

  # Policy lives in deny.toml at the repository root.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  # Informational until semanticore-core 0.1.0 is on crates.io: there is no
  # published baseline to compare against yet, so the job reports that and
  # passes. Even with a baseline, `continue-on-error` keeps a violation from
  # failing the workflow. See CONTRIBUTING.md ("Semver checks") for the steps
  # to make this job blocking after the first release.
  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Look for a published baseline
        id: baseline
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "semanticore-ci (https://github.com/${GITHUB_REPOSITORY})" \
            https://crates.io/api/v1/crates/semanticore-core)
          echo "crates.io responded HTTP ${status}"
          if [ "${status}" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=semver-checks skipped::semanticore-core has no release on crates.io yet, so there is no baseline to compare against."
          fi
      - name: cargo semver-checks
        if: steps.baseline.outputs.published == 'true'
        run: cargo semver-checks --package semanticore-core
