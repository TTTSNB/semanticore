name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (based on another PR's branch) need
  # the required `lint` and `test` checks too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every third-party action is pinned to a full commit SHA; the trailing
# comment records the tag it resolved from. To bump one, resolve the new tag
# with `git ls-remote --tags https://github.com/<owner>/<repo>` (use the
# `^{}` line for annotated tags) and update both the SHA and the comment.
#
# The job names `lint` and `test` are required status checks under branch
# protection. Do not rename them.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # semanticore-context-py's Rust-side tests embed CPython and link
      # libpython; setup-python provides a shared build of the minimum
      # supported version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: cargo test
        run: cargo test --all --all-features
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib

  # Build and test on exactly the `rust-version` declared in Cargo.toml.
  # Keep the toolchain below in sync with `workspace.package.rust-version`.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      # No lockfile is committed, so ask the resolver to prefer dependency
      # versions whose own rust-version is <= 1.88 (what downstream users on
      # the MSRV get with Cargo's MSRV-aware resolver).
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      # semanticore-context-py's Rust-side tests embed CPython and link
      # libpython; setup-python provides a shared build of the minimum
      # supported version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Confirm toolchain
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.'
      - name: cargo build
        run: cargo build --workspace --all-targets --all-features
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib
      - name: cargo test
        run: cargo test --workspace --all-features
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # semanticore-context-py's Rust-side tests embed CPython and link
      # libpython; setup-python provides a shared build of the minimum
      # supported version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
      - name: cargo test --doc
        run: cargo test --workspace --doc --all-features
        env:
          LD_LIBRARY_PATH: ${{ env.pythonLocation }}/lib

  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo publish --dry-run
        run: cargo publish --dry-run -p semanticore-core

  # Policy lives in deny.toml at the repository root.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  # Informational until semanticore-core 0.1.0 is on crates.io: there is no
  # published baseline to compare against yet, so the job reports that and
  # passes. Even with a baseline, `continue-on-error` keeps a violation from
  # failing the workflow. See CONTRIBUTING.md ("Semver checks") for the steps
  # to make this job blocking after the first release.
  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Look for a published baseline
        id: baseline
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "semanticore-ci (https://github.com/${GITHUB_REPOSITORY})" \
            https://crates.io/api/v1/crates/semanticore-core)
          echo "crates.io responded HTTP ${status}"
          if [ "${status}" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=semver-checks skipped::semanticore-core has no release on crates.io yet, so there is no baseline to compare against."
          fi
      - name: cargo semver-checks
        if: steps.baseline.outputs.published == 'true'
        run: cargo semver-checks --package semanticore-core

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The abi3 floor and the newest CPython the wheel is tested on.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: python-wheel
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install "maturin==1.16.0" "pytest==9.2.0" "mypy==2.4.1"
      - name: Build the abi3 wheel
        run: maturin build -m crates/semanticore-context-py/Cargo.toml --out dist
      - name: Install the wheel
        run: |
          ls dist
          test -n "$(ls dist/*-cp310-abi3-*.whl)"
          python -m pip install dist/*.whl
      - name: pytest
        run: python -m pytest crates/semanticore-context-py/tests
      - name: Check the .pyi stub against the built module
        # Run outside the source tree so the installed wheel is checked.
        working-directory: ${{ runner.temp }}
        run: >-
          python -m mypy.stubtest semanticore_context
          --allowlist "$GITHUB_WORKSPACE/crates/semanticore-context-py/stubtest-allowlist.txt"
