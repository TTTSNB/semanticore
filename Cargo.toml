[workspace]
resolver = "2"
members = [
    "crates/semanticore-core",
    "crates/semanticore-storage-testkit",
    "crates/semanticore-store-oxigraph",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TTTSNB/semanticore"
authors = ["Elliott Risch <elliottrisch@gmail.com>"]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
