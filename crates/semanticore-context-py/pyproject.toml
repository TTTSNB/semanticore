[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
# RFC 0001 "Naming convention": PyPI names use underscores.
name = "semanticore_context_py"
description = "Python binding for semanticore-context, the semantiCore Context OS (RFC 0004)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
# The import name from RFC 0004 "Bindings story":
# `from semanticore_context import Session, ...`.
module-name = "semanticore_context"
# semanticore_context.pyi (next to this file) ships in the wheel with a
# py.typed marker.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
